<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17-Track Order Tracking Service</title>
    <style>
        :root {
            --bg: #0c0e1a;
            --surface: rgba(255, 255, 255, 0.06);
            --surface-strong: rgba(255, 255, 255, 0.12);
            --card: #0f1426;
            --primary: #7c5dff;
            --primary-2: #65d8ff;
            --text: #e8edff;
            --muted: #a8b2d1;
            --border: rgba(255, 255, 255, 0.15);
            --shadow: 0 20px 60px rgba(0,0,0,0.55);
            --radius: 14px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(101, 216, 255, 0.18), transparent 25%),
                radial-gradient(circle at 80% 0%, rgba(124, 93, 255, 0.25), transparent 30%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.02), transparent 35%),
                var(--bg);
            min-height: 100vh;
            padding: 32px 20px 40px;
            color: var(--text);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 2.8em;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
            background: linear-gradient(120deg, #ffffff, var(--primary-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 1.05em;
            color: var(--muted);
        }

        .card {
            background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 26px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .tabs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 8px;
            margin-bottom: 18px;
        }

        .tab {
            padding: 12px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            color: var(--muted);
            transition: all 0.25s ease;
            text-align: center;
        }

        .tab:hover {
            background: var(--surface-strong);
            color: var(--text);
            transform: translateY(-1px);
        }

        .tab.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
            color: #0c0e1a;
            border-color: transparent;
            box-shadow: 0 12px 30px rgba(101, 216, 255, 0.25);
            font-weight: 700;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.25s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-size: 1.35em;
            margin-bottom: 14px;
            letter-spacing: -0.25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--text);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-2);
            box-shadow: 0 0 0 3px rgba(101, 216, 255, 0.15);
        }

        button {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
            color: #0c0e1a;
            border: none;
            padding: 12px 26px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 12px 30px rgba(124, 93, 255, 0.25);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 36px rgba(124, 93, 255, 0.35);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .tracking-result {
            margin-top: 18px;
            padding: 18px;
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .tracking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 12px;
        }

        .tracking-number {
            font-size: 1.3em;
            font-weight: 700;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.85em;
            font-weight: 700;
            text-transform: capitalize;
            border: 1px solid var(--border);
        }

        .status-delivered { background: rgba(93, 255, 171, 0.18); color: #c8f7df; }
        .status-in-transit { background: rgba(101, 216, 255, 0.18); color: #d8f4ff; }
        .status-pending { background: rgba(255, 205, 111, 0.15); color: #ffe7b6; }
        .status-error { background: rgba(255, 126, 126, 0.16); color: #ffd1d1; }

        .tracking-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin: 12px 0 10px;
        }

        .info-item {
            padding: 12px;
            background: var(--surface);
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .info-label {
            font-size: 0.85em;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .info-value {
            font-weight: 700;
        }

        .events-list {
            margin-top: 16px;
        }

        .events-list h3 {
            margin-bottom: 10px;
            font-size: 1em;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .event-item {
            padding: 14px;
            background: var(--surface);
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
        }

        .event-time {
            font-size: 0.9em;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .event-description {
            font-weight: 600;
        }

        .event-location {
            font-size: 0.9em;
            color: #9cc8ff;
            margin-top: 4px;
        }

        .alert {
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 14px;
            border: 1px solid var(--border);
        }

        .alert-success {
            background: rgba(93, 255, 171, 0.12);
            color: #d4ffe6;
        }

        .alert-error {
            background: rgba(255, 126, 126, 0.12);
            color: #ffd6d6;
        }

        .file-upload {
            border: 1px dashed var(--border);
            padding: 22px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
            background: var(--surface);
            color: var(--muted);
        }

        .file-upload:hover {
            background: var(--surface-strong);
            border-color: rgba(101, 216, 255, 0.6);
            color: var(--text);
        }

        .loader {
            border: 4px solid rgba(255,255,255,0.08);
            border-top: 4px solid var(--primary-2);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .tracking-list {
            display: grid;
            gap: 12px;
        }

        .tracking-list-item {
            padding: 14px 16px;
            background: var(--surface);
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
            border: 1px solid var(--border);
        }

        .tracking-list-item:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 28px rgba(0,0,0,0.35);
            border-color: rgba(101, 216, 255, 0.6);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📦 17-Track Order Tracking</h1>
        <p>Track your shipments with ease</p>
    </div>

    <div class="card">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('register')">Register Tracking</button>
            <button class="tab" onclick="switchTab('query')">Query Status</button>
            <button class="tab" onclick="switchTab('batch')">Batch Import</button>
            <button class="tab" onclick="switchTab('list')">All Trackings</button>
        </div>

        <!-- Register Tab -->
        <div id="register-tab" class="tab-content active">
            <h2>Register New Tracking Number</h2>
            <div id="register-alert"></div>
            <form onsubmit="registerTracking(event)">
                <div class="form-group">
                    <label>Tracking Number *</label>
                    <input type="text" id="register-tracking-number" required placeholder="Enter tracking number">
                </div>
                <div class="form-group">
                    <label>Carrier (Optional)</label>
                    <select id="register-carrier">
                        <option value="">Auto-detect</option>
                        <option value="101">USPS</option>
                        <option value="102">FedEx</option>
                        <option value="103">UPS</option>
                        <option value="104">DHL</option>
                        <option value="105">China Post</option>
                        <option value="107">SF Express</option>
                        <option value="2001">Canada Post</option>
                        <option value="2002">Royal Mail</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description (Optional)</label>
                    <textarea id="register-description" rows="3" placeholder="Order details or notes"></textarea>
                </div>
                <button type="submit">Register Tracking</button>
            </form>
        </div>

        <!-- Query Tab -->
        <div id="query-tab" class="tab-content">
            <h2>Query Tracking Status</h2>
            <div id="query-alert"></div>
            <form onsubmit="queryTracking(event)">
                <div class="form-group">
                    <label>Tracking Number *</label>
                    <input type="text" id="query-tracking-number" required placeholder="Enter tracking number">
                </div>
                <button type="submit">Search</button>
            </form>
            <div id="tracking-result"></div>
        </div>

        <!-- Batch Tab -->
        <div id="batch-tab" class="tab-content">
            <h2>Batch Import from CSV</h2>
            <div id="batch-alert"></div>
            <p style="margin-bottom: 15px; color: #666;">
                CSV Format: tracking_number, carrier_code (optional), description (optional)
            </p>
            <div class="file-upload" onclick="document.getElementById('csv-file').click()">
                <input type="file" id="csv-file" accept=".csv" style="display: none" onchange="uploadCSV()">
                <p>📁 Click to upload CSV file</p>
            </div>
            <div id="batch-result"></div>
        </div>

        <!-- List Tab -->
        <div id="list-tab" class="tab-content">
            <h2>All Trackings</h2>
            <button onclick="loadAllTrackings()" style="margin-bottom: 15px;">Refresh List</button>
            <div id="tracking-list"></div>
        </div>
    </div>
</div>

<script>
    const API_BASE = 'http://localhost:8080/api';

    function switchTab(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById(tabName + '-tab').classList.add('active');

        if (tabName === 'list') {
            loadAllTrackings();
        }
    }

    async function registerTracking(e) {
        e.preventDefault();
        const alertDiv = document.getElementById('register-alert');
        const trackingNumber = document.getElementById('register-tracking-number').value;
        const carrier = document.getElementById('register-carrier').value;
        const description = document.getElementById('register-description').value;

        try {
            const response = await fetch(`${API_BASE}/tracking/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    tracking_number: trackingNumber,
                    carrier: carrier ? parseInt(carrier) : null,
                    description: description
                })
            });

            const result = await response.json();
            if (result.success) {
                alertDiv.innerHTML = '<div class="alert alert-success">✓ Tracking registered successfully!</div>';
                e.target.reset();
            } else {
                alertDiv.innerHTML = `<div class="alert alert-error">✗ ${result.message}</div>`;
            }
        } catch (error) {
            alertDiv.innerHTML = `<div class="alert alert-error">✗ Error: ${error.message}</div>`;
        }
    }

    async function queryTracking(e) {
        e.preventDefault();
        const alertDiv = document.getElementById('query-alert');
        const resultDiv = document.getElementById('tracking-result');
        const trackingNumber = document.getElementById('query-tracking-number').value;

        resultDiv.innerHTML = '<div class="loader"></div>';

        try {
            const response = await fetch(`${API_BASE}/tracking/number/${trackingNumber}`);
            const result = await response.json();

            if (result.success) {
                displayTrackingResult(result.data, resultDiv);
                alertDiv.innerHTML = '';
            } else {
                alertDiv.innerHTML = `<div class="alert alert-error">✗ ${result.message}</div>`;
                resultDiv.innerHTML = '';
            }
        } catch (error) {
            alertDiv.innerHTML = `<div class="alert alert-error">✗ Error: ${error.message}</div>`;
            resultDiv.innerHTML = '';
        }
    }

    function displayTrackingResult(data, container) {
        const statusClass = 'status-' + data.status.toLowerCase().replace('_', '-');

        let html = `
                <div class="tracking-result">
                    <div class="tracking-header">
                        <span class="tracking-number">${data.tracking_number}</span>
                        <span class="status-badge ${statusClass}">${data.status}</span>
                    </div>
                    <div class="tracking-info">
                        <div class="info-item">
                            <div class="info-label">Carrier</div>
                            <div class="info-value">${data.carrier_name || 'Unknown'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Last Updated</div>
                            <div class="info-value">${formatDate(data.updated_at)}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Description</div>
                            <div class="info-value">${data.description || 'N/A'}</div>
                        </div>
                    </div>
            `;

        if (data.events && data.events.length > 0) {
            html += '<div class="events-list"><h3>Tracking Events</h3>';
            data.events.forEach(event => {
                html += `
                        <div class="event-item">
                            <div class="event-time">${formatDate(event.event_time)}</div>
                            <div class="event-description">${event.description || 'Event'}</div>
                            ${event.location ? `<div class="event-location">📍 ${event.location}</div>` : ''}
                        </div>
                    `;
            });
            html += '</div>';
        }

        html += '</div>';
        container.innerHTML = html;
    }

    async function uploadCSV() {
        const file = document.getElementById('csv-file').files[0];
        const alertDiv = document.getElementById('batch-alert');
        const resultDiv = document.getElementById('batch-result');

        if (!file) return;

        const formData = new FormData();
        formData.append('file', file);

        resultDiv.innerHTML = '<div class="loader"></div>';

        try {
            const response = await fetch(`${API_BASE}/tracking/import-csv`, {
                method: 'POST',
                body: formData
            });

            const result = await response.json();
            if (result.success) {
                alertDiv.innerHTML = `<div class="alert alert-success">✓ Imported successfully! Success: ${result.data.success_count}, Errors: ${result.data.error_count}</div>`;

                let html = '<h3>Import Results</h3>';
                result.data.results.forEach(r => {
                    const statusClass = r.success ? 'alert-success' : 'alert-error';
                    html += `<div class="alert ${statusClass}">${r.tracking_number}: ${r.message}</div>`;
                });
                resultDiv.innerHTML = html;
            } else {
                alertDiv.innerHTML = `<div class="alert alert-error">✗ ${result.message}</div>`;
                resultDiv.innerHTML = '';
            }
        } catch (error) {
            alertDiv.innerHTML = `<div class="alert alert-error">✗ Error: ${error.message}</div>`;
            resultDiv.innerHTML = '';
        }
    }

    async function loadAllTrackings() {
        const container = document.getElementById('tracking-list');
        container.innerHTML = '<div class="loader"></div>';

        try {
            const response = await fetch(`${API_BASE}/tracking/all`);
            const result = await response.json();

            if (result.success && result.data.length > 0) {
                let html = '<div class="tracking-list">';
                result.data.forEach(tracking => {
                    const statusClass = 'status-' + tracking.status.toLowerCase().replace('_', '-');
                    html += `
                            <div class="tracking-list-item" onclick="showTrackingDetails('${tracking.tracking_number}')">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <div>
                                        <strong>${tracking.tracking_number}</strong>
                                        <div style="font-size: 0.9em; color: #666;">${tracking.carrier_name || 'Unknown Carrier'}</div>
                                    </div>
                                    <span class="status-badge ${statusClass}">${tracking.status}</span>
                                </div>
                            </div>
                        `;
                });
                html += '</div>';
                container.innerHTML = html;
            } else {
                container.innerHTML = '<p style="text-align: center; color: #666;">No trackings found</p>';
            }
        } catch (error) {
            container.innerHTML = `<div class="alert alert-error">✗ Error loading trackings: ${error.message}</div>`;
        }
    }

    function showTrackingDetails(trackingNumber) {
        document.getElementById('query-tracking-number').value = trackingNumber;
        switchTab('query');
        document.querySelector('.tab:nth-child(2)').click();
        queryTracking(new Event('submit'));
    }

    function formatDate(dateStr) {
        if (!dateStr) return 'N/A';
        const date = new Date(dateStr);
        return date.toLocaleString();
    }
</script>
</body>
</html>
