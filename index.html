<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17-Track Order Tracking Service</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .tracking-result {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .tracking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .tracking-number {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-delivered { background: #d4edda; color: #155724; }
        .status-in-transit { background: #cce5ff; color: #004085; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-error { background: #f8d7da; color: #721c24; }

        .tracking-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }

        .info-item {
            padding: 10px;
            background: white;
            border-radius: 6px;
        }

        .info-label {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 5px;
        }

        .info-value {
            font-weight: 600;
            color: #333;
        }

        .events-list {
            margin-top: 20px;
        }

        .event-item {
            padding: 15px;
            background: white;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 3px solid #667eea;
        }

        .event-time {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .event-description {
            font-weight: 500;
            color: #333;
        }

        .event-location {
            font-size: 0.9em;
            color: #999;
            margin-top: 5px;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .file-upload {
            border: 2px dashed #667eea;
            padding: 30px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .file-upload:hover {
            background: #f8f9fa;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .tracking-list {
            display: grid;
            gap: 15px;
        }

        .tracking-list-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border-left: 4px solid #667eea;
        }

        .tracking-list-item:hover {
            transform: translateX(5px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📦 17-Track Order Tracking</h1>
        <p>Track your shipments with ease</p>
    </div>

    <div class="card">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('register')">Register Tracking</button>
            <button class="tab" onclick="switchTab('query')">Query Status</button>
            <button class="tab" onclick="switchTab('batch')">Batch Import</button>
            <button class="tab" onclick="switchTab('list')">All Trackings</button>
        </div>

        <!-- Register Tab -->
        <div id="register-tab" class="tab-content active">
            <h2>Register New Tracking Number</h2>
            <div id="register-alert"></div>
            <form onsubmit="registerTracking(event)">
                <div class="form-group">
                    <label>Tracking Number *</label>
                    <input type="text" id="register-tracking-number" required placeholder="Enter tracking number">
                </div>
                <div class="form-group">
                    <label>Carrier (Optional)</label>
                    <select id="register-carrier">
                        <option value="">Auto-detect</option>
                        <option value="101">USPS</option>
                        <option value="102">FedEx</option>
                        <option value="103">UPS</option>
                        <option value="104">DHL</option>
                        <option value="105">China Post</option>
                        <option value="107">SF Express</option>
                        <option value="2001">Canada Post</option>
                        <option value="2002">Royal Mail</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description (Optional)</label>
                    <textarea id="register-description" rows="3" placeholder="Order details or notes"></textarea>
                </div>
                <button type="submit">Register Tracking</button>
            </form>
        </div>

        <!-- Query Tab -->
        <div id="query-tab" class="tab-content">
            <h2>Query Tracking Status</h2>
            <div id="query-alert"></div>
            <form onsubmit="queryTracking(event)">
                <div class="form-group">
                    <label>Tracking Number *</label>
                    <input type="text" id="query-tracking-number" required placeholder="Enter tracking number">
                </div>
                <button type="submit">Search</button>
            </form>
            <div id="tracking-result"></div>
        </div>

        <!-- Batch Tab -->
        <div id="batch-tab" class="tab-content">
            <h2>Batch Import from CSV</h2>
            <div id="batch-alert"></div>
            <p style="margin-bottom: 15px; color: #666;">
                CSV Format: tracking_number, carrier_code (optional), description (optional)
            </p>
            <div class="file-upload" onclick="document.getElementById('csv-file').click()">
                <input type="file" id="csv-file" accept=".csv" style="display: none" onchange="uploadCSV()">
                <p>📁 Click to upload CSV file</p>
            </div>
            <div id="batch-result"></div>
        </div>

        <!-- List Tab -->
        <div id="list-tab" class="tab-content">
            <h2>All Trackings</h2>
            <button onclick="loadAllTrackings()" style="margin-bottom: 15px;">Refresh List</button>
            <div id="tracking-list"></div>
        </div>
    </div>
</div>

<script>
    const API_BASE = 'http://localhost:8080/api';

    function switchTab(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById(tabName + '-tab').classList.add('active');

        if (tabName === 'list') {
            loadAllTrackings();
        }
    }

    async function registerTracking(e) {
        e.preventDefault();
        const alertDiv = document.getElementById('register-alert');
        const trackingNumber = document.getElementById('register-tracking-number').value;
        const carrier = document.getElementById('register-carrier').value;
        const description = document.getElementById('register-description').value;

        try {
            const response = await fetch(`${API_BASE}/tracking/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    tracking_number: trackingNumber,
                    carrier: carrier ? parseInt(carrier) : null,
                    description: description
                })
            });

            const result = await response.json();
            if (result.success) {
                alertDiv.innerHTML = '<div class="alert alert-success">✓ Tracking registered successfully!</div>';
                e.target.reset();
            } else {
                alertDiv.innerHTML = `<div class="alert alert-error">✗ ${result.message}</div>`;
            }
        } catch (error) {
            alertDiv.innerHTML = `<div class="alert alert-error">✗ Error: ${error.message}</div>`;
        }
    }

    async function queryTracking(e) {
        e.preventDefault();
        const alertDiv = document.getElementById('query-alert');
        const resultDiv = document.getElementById('tracking-result');
        const trackingNumber = document.getElementById('query-tracking-number').value;

        resultDiv.innerHTML = '<div class="loader"></div>';

        try {
            const response = await fetch(`${API_BASE}/tracking/number/${trackingNumber}`);
            const result = await response.json();

            if (result.success) {
                displayTrackingResult(result.data, resultDiv);
                alertDiv.innerHTML = '';
            } else {
                alertDiv.innerHTML = `<div class="alert alert-error">✗ ${result.message}</div>`;
                resultDiv.innerHTML = '';
            }
        } catch (error) {
            alertDiv.innerHTML = `<div class="alert alert-error">✗ Error: ${error.message}</div>`;
            resultDiv.innerHTML = '';
        }
    }

    function displayTrackingResult(data, container) {
        const statusClass = 'status-' + data.status.toLowerCase().replace('_', '-');

        let html = `
                <div class="tracking-result">
                    <div class="tracking-header">
                        <span class="tracking-number">${data.tracking_number}</span>
                        <span class="status-badge ${statusClass}">${data.status}</span>
                    </div>
                    <div class="tracking-info">
                        <div class="info-item">
                            <div class="info-label">Carrier</div>
                            <div class="info-value">${data.carrier_name || 'Unknown'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Last Updated</div>
                            <div class="info-value">${formatDate(data.updated_at)}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Description</div>
                            <div class="info-value">${data.description || 'N/A'}</div>
                        </div>
                    </div>
            `;

        if (data.events && data.events.length > 0) {
            html += '<div class="events-list"><h3>Tracking Events</h3>';
            data.events.forEach(event => {
                html += `
                        <div class="event-item">
                            <div class="event-time">${formatDate(event.event_time)}</div>
                            <div class="event-description">${event.description || 'Event'}</div>
                            ${event.location ? `<div class="event-location">📍 ${event.location}</div>` : ''}
                        </div>
                    `;
            });
            html += '</div>';
        }

        html += '</div>';
        container.innerHTML = html;
    }

    async function uploadCSV() {
        const file = document.getElementById('csv-file').files[0];
        const alertDiv = document.getElementById('batch-alert');
        const resultDiv = document.getElementById('batch-result');

        if (!file) return;

        const formData = new FormData();
        formData.append('file', file);

        resultDiv.innerHTML = '<div class="loader"></div>';

        try {
            const response = await fetch(`${API_BASE}/tracking/import-csv`, {
                method: 'POST',
                body: formData
            });

            const result = await response.json();
            if (result.success) {
                alertDiv.innerHTML = `<div class="alert alert-success">✓ Imported successfully! Success: ${result.data.success_count}, Errors: ${result.data.error_count}</div>`;

                let html = '<h3>Import Results</h3>';
                result.data.results.forEach(r => {
                    const statusClass = r.success ? 'alert-success' : 'alert-error';
                    html += `<div class="alert ${statusClass}">${r.tracking_number}: ${r.message}</div>`;
                });
                resultDiv.innerHTML = html;
            } else {
                alertDiv.innerHTML = `<div class="alert alert-error">✗ ${result.message}</div>`;
                resultDiv.innerHTML = '';
            }
        } catch (error) {
            alertDiv.innerHTML = `<div class="alert alert-error">✗ Error: ${error.message}</div>`;
            resultDiv.innerHTML = '';
        }
    }

    async function loadAllTrackings() {
        const container = document.getElementById('tracking-list');
        container.innerHTML = '<div class="loader"></div>';

        try {
            const response = await fetch(`${API_BASE}/tracking/all`);
            const result = await response.json();

            if (result.success && result.data.length > 0) {
                let html = '<div class="tracking-list">';
                result.data.forEach(tracking => {
                    const statusClass = 'status-' + tracking.status.toLowerCase().replace('_', '-');
                    html += `
                            <div class="tracking-list-item" onclick="showTrackingDetails('${tracking.tracking_number}')">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <div>
                                        <strong>${tracking.tracking_number}</strong>
                                        <div style="font-size: 0.9em; color: #666;">${tracking.carrier_name || 'Unknown Carrier'}</div>
                                    </div>
                                    <span class="status-badge ${statusClass}">${tracking.status}</span>
                                </div>
                            </div>
                        `;
                });
                html += '</div>';
                container.innerHTML = html;
            } else {
                container.innerHTML = '<p style="text-align: center; color: #666;">No trackings found</p>';
            }
        } catch (error) {
            container.innerHTML = `<div class="alert alert-error">✗ Error loading trackings: ${error.message}</div>`;
        }
    }

    function showTrackingDetails(trackingNumber) {
        document.getElementById('query-tracking-number').value = trackingNumber;
        switchTab('query');
        document.querySelector('.tab:nth-child(2)').click();
        queryTracking(new Event('submit'));
    }

    function formatDate(dateStr) {
        if (!dateStr) return 'N/A';
        const date = new Date(dateStr);
        return date.toLocaleString();
    }
</script>
</body>
</html>
